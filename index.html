<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - AI Allocation Engine</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                🤖
            </div>

            <h1>AI Allocation Engine</h1>

            <p class="auth-subtitle">
                PM Internship Scheme
            </p>

            <div id="loginMessage" class="message"></div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="loginButton"
                    class="primary-btn">

                    Login

                </button>

            </form>

            <p class="auth-footer">

                Don't have an account?

                <a href="./register.html">
                    Create Account
                </a>

            </p>

        </div>

    </div>

    <!-- ONLY LOGIN JAVASCRIPT ON LOGIN PAGE -->
    <script src="./login.js"></script>

</body>

</html>
