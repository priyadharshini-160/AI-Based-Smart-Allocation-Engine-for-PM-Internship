<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Allocation</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="app-layout">

    <aside class="sidebar">

        <div class="sidebar-logo">🤖</div>

        <h2>AI Allocation</h2>

        <p class="sidebar-subtitle">
            PM Internship Scheme
        </p>

        <nav>

            <a href="dashboard.html"
               class="nav-link">
                🏠 Dashboard
            </a>

            <a href="students.html"
               class="nav-link student-only">
                🎓 My Profile
            </a>

            <a href="companies.html"
               class="nav-link company-only">
                🏢 Company Profile
            </a>

            <a href="internships.html"
               class="nav-link">
                💼 Internships
            </a>

            <a href="allocation.html"
               class="nav-link active">
                🤖 AI Allocation
            </a>

            <a href="reports.html"
               class="nav-link">
                📊 Reports
            </a>

        </nav>

        <button onclick="logout()" class="logout-btn">
            🚪 Logout
        </button>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>

                <h1>AI Smart Allocation</h1>

                <p>
                    Find the best internship matches
                </p>

            </div>

        </header>


        <section class="section-card">

            <div id="allocationMessage"
                 class="message">
            </div>


            <div id="studentAllocation">

                <h2>
                    My AI Recommendations
                </h2>

                <button
                    id="runPrediction"
                    class="primary-btn"
                    style="max-width:300px;">

                    🤖 Find Best Matches

                </button>


                <div id="recommendationList"
                     class="recommendation-list"
                     style="margin-top:25px;">

                </div>

            </div>


            <div id="companyAllocation"
                 style="display:none;">

                <h2>
                    Student Matching
                </h2>

                <p style="margin-bottom:20px;color:#64748b;">

                    Select an internship to find the most suitable
                    students.

                </p>


                <select
                    id="companyInternshipSelect"
                    class="large-select">

                    <option value="">
                        Select Internship
                    </option>

                </select>


                <div
                    id="companyMatches"
                    style="margin-top:25px;">

                </div>

            </div>

        </section>

    </main>

</div>


<script src="js/common.js"></script>
<script src="js/allocation.js"></script>

</body>

</html>
