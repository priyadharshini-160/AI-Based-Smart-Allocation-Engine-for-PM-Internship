<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - AI Smart Allocation Engine</title>

    <link rel="stylesheet" href="./style.css">

</head>


<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            🤖
        </div>

        <h1>AI Smart Allocation Engine</h1>

        <p class="subtitle">
            Create Your Account
        </p>


        <form id="registerForm">


            <!-- NAME -->

            <div class="form-group">

                <label for="registerName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="registerEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                    required
                >

            </div>


            <!-- ROLE -->

            <div class="form-group">

                <label>
                    Register As
                </label>


                <div class="role-options">

                    <label class="role-option">

                        <input
                            type="radio"
                            name="role"
                            value="student"
                            checked
                        >

                        <span>
                            🎓 Student
                        </span>

                    </label>


                    <label class="role-option">

                        <input
                            type="radio"
                            name="role"
                            value="company"
                        >

                        <span>
                            🏢 Company
                        </span>

                    </label>

                </div>

            </div>


            <div id="registerMessage"
                 class="message">
            </div>


            <button
                type="submit"
                class="primary-btn">

                Create Account

            </button>


        </form>


        <div class="auth-footer">

            <p>

                Already have an account?

                <a href="index.html">
                    Login
                </a>

            </p>

        </div>

    </div>

</div>


<script src="./common.js"></script>
<script src="./register.js"></script>

</body>

</html>
