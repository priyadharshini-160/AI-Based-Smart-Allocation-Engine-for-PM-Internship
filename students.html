<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Profile</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="app-layout">

    <aside class="sidebar">

        <div class="sidebar-logo">🤖</div>

        <h2>AI Allocation</h2>

        <p class="sidebar-subtitle">
            PM Internship Scheme
        </p>

        <nav>

            <a href="dashboard.html" class="nav-link">
                🏠 Dashboard
            </a>

            <a href="students.html"
               class="nav-link active">
                🎓 My Profile
            </a>

            <a href="internships.html"
               class="nav-link">
                💼 Internships
            </a>

            <a href="allocation.html"
               class="nav-link">
                🤖 AI Allocation
            </a>

            <a href="reports.html"
               class="nav-link">
                📊 Reports
            </a>

        </nav>

        <button onclick="logout()" class="logout-btn">
            🚪 Logout
        </button>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Student Profile</h1>
                <p>Enter your academic and skill details</p>
            </div>

        </header>


        <section class="section-card">

            <h2>Student Information</h2>

            <div id="studentMessage"
                 class="message">
            </div>


            <form id="studentForm">


                <div class="form-grid">

                    <div class="form-group">

                        <label>Student Name</label>

                        <input
                            type="text"
                            id="studentName"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Email</label>

                        <input
                            type="email"
                            id="studentEmail"
                            readonly
                        >

                    </div>


                    <div class="form-group">

                        <label>Department</label>

                        <input
                            type="text"
                            id="department"
                            placeholder="Example: CSE"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>CGPA</label>

                        <input
                            type="number"
                            id="cgpa"
                            min="0"
                            max="10"
                            step="0.01"
                            placeholder="Example: 8.2"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Skills</label>

                        <input
                            type="text"
                            id="skills"
                            placeholder="Python, Java, SQL"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Preferred Domain</label>

                        <input
                            type="text"
                            id="domain"
                            placeholder="AI, Web Development, Data Science"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Location Preference</label>

                        <input
                            type="text"
                            id="location"
                            placeholder="Chennai"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Experience Level</label>

                        <select id="experience" required>

                            <option value="">
                                Select
                            </option>

                            <option value="beginner">
                                Beginner
                            </option>

                            <option value="intermediate">
                                Intermediate
                            </option>

                            <option value="advanced">
                                Advanced
                            </option>

                        </select>

                    </div>

                </div>


                <button
                    type="submit"
                    class="primary-btn">

                    Save Student Profile

                </button>

            </form>

        </section>

    </main>

</div>


<script src="js/common.js"></script>
<script src="js/students.js"></script>

</body>
</html>
