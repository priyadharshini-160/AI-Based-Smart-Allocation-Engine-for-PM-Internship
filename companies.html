<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Company Profile</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="app-layout">

    <aside class="sidebar">

        <div class="sidebar-logo">🤖</div>

        <h2>AI Allocation</h2>

        <p class="sidebar-subtitle">
            PM Internship Scheme
        </p>

        <nav>

            <a href="dashboard.html"
               class="nav-link">
                🏠 Dashboard
            </a>

            <a href="companies.html"
               class="nav-link active">
                🏢 Company Profile
            </a>

            <a href="internships.html"
               class="nav-link">
                💼 Internships
            </a>

            <a href="allocation.html"
               class="nav-link">
                🤖 AI Allocation
            </a>

            <a href="reports.html"
               class="nav-link">
                📊 Reports
            </a>

        </nav>

        <button onclick="logout()" class="logout-btn">
            🚪 Logout
        </button>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>

                <h1>Company Profile</h1>

                <p>
                    Enter your company information
                </p>

            </div>

        </header>


        <section class="section-card">

            <h2>Company Information</h2>

            <div id="companyMessage"
                 class="message">
            </div>


            <form id="companyForm">

                <div class="form-grid">


                    <div class="form-group">

                        <label>
                            Company Name
                        </label>

                        <input
                            type="text"
                            id="companyName"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            id="companyEmail"
                            readonly
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Industry
                        </label>

                        <input
                            type="text"
                            id="industry"
                            placeholder="IT / Finance / Healthcare"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Location
                        </label>

                        <input
                            type="text"
                            id="companyLocation"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Company Size
                        </label>

                        <select
                            id="companySize"
                            required>

                            <option value="">
                                Select
                            </option>

                            <option value="small">
                                Small
                            </option>

                            <option value="medium">
                                Medium
                            </option>

                            <option value="large">
                                Large
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Website
                        </label>

                        <input
                            type="text"
                            id="website"
                            placeholder="https://example.com"
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="primary-btn">

                    Save Company Profile

                </button>

            </form>

        </section>

    </main>

</div>


<script src="js/common.js"></script>
<script src="js/companies.js"></script>

</body>

</html>
